artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  source_url: "https://www.kaggle.com/datasets/saurabhshahane/fake-news-classification"
  raw_data_dir: data/raw
  local_data_file: artifacts/data_ingestion/WELFake_Dataset.csv

data_transformation:
  root_dir: artifacts/data_transformation
  data_path: artifacts/data_ingestion/WELFake_Dataset.csv
  transformed_train_path: artifacts/data_transformation/train.csv
  transformed_test_path: artifacts/data_transformation/test.csv

model_trainer:
  root_dir: artifacts/model_trainer
  train_data_path: artifacts/data_transformation/train.csv
  test_data_path: artifacts/data_transformation/test.csv
  model_path: artifacts/model_trainer/model.joblib
  vectorizer_path: artifacts/model_trainer/tfidf_vectorizer.joblib

model_evaluation:
  root_dir: artifacts/model_evaluation
  model_path: artifacts/model_trainer/model.joblib
  vectorizer_path: artifacts/model_trainer/tfidf_vectorizer.joblib
  test_data_path: artifacts/data_transformation/test.csv
  metric_file_path: artifacts/model_evaluation/metrics.json
  mlflow_uri: "http://localhost:5000"
  experiment_name: "FakeNewsDetection"
